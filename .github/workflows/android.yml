name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

env:
  # R8 and resource shrinking are enabled in app.json for the tuned build.
  # The baseline step turns them off through -P, which overrides the value
  # prebuild writes into gradle.properties, so a tuning problem can never
  # leave the project without an installable APK.
  BASELINE_FLAGS: >-
    -Pmirai.arm64Only=false
    -Pandroid.enableProguardInReleaseBuilds=false
    -Pandroid.enableShrinkResourcesInReleaseBuilds=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      # Step 1 is deliberately the conservative configuration: universal
      # ABI set, no R8, no resource shrinking. Everything it uses is stock
      # Expo, so it is the variant that must always produce an APK.
      - name: Build baseline release APK
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=false \
            -Pandroid.enableProguardInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle-baseline.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "::group::gradle output (last 60 lines)"
              tail -n 60 ../gradle-baseline.log
              echo "::endgroup::"
            } | while IFS= read -r line; do
              echo "::error::baseline: ${line}"
            done
          fi
          exit "$status"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: mirai-rpg-apk-universal
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Step 2 applies the device tuning from mirai-rpg-mi10-optimization.md:
      # R8, resource shrinking and an arm64-v8a-only split. It is allowed to
      # fail so a regression in the tuning cannot block the release, and its
      # failure reason is echoed as annotations because a gradle failure is
      # otherwise invisible through the API without repo admin rights.
      - name: Build tuned arm64 APK
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=true \
            -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../gradle-arm64.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 ../gradle-arm64.log | while IFS= read -r line; do
              echo "::error::tuned: ${line}"
            done
          fi
          exit "$status"

      - name: Upload tuned arm64 APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mirai-rpg-apk-arm64
          path: android/app/build/outputs/apk/release/*arm64*.apk
          if-no-files-found: warn

      - name: Upload gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            gradle-baseline.log
            gradle-arm64.log
          if-no-files-found: warn

      - name: Report APK sizes
        if: always()
        run: |
          cd android/app/build/outputs/apk/release 2>/dev/null || exit 0
          for f in *.apk; do
            echo "$(du -h "$f" | cut -f1)  $f"
          done

  # x86_64 build for the emulator smoke test, in parallel so it does not
  # extend the wall clock. continue-on-error throughout: the emulator is a
  # smoke signal, not a gate, and it has never been a substitute for the
  # real device.
  smoke-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build x86_64 release APK
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=false \
            -Pandroid.enableProguardInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -PreactNativeArchitectures=x86_64 2>&1 | tee ../gradle-x86.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 ../gradle-x86.log | while IFS= read -r line; do
              echo "::error::x86: ${line}"
            done
          fi
          exit "$status"

      - name: Run Android emulator smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            echo "installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.mirai.rpg
            adb shell am start -n com.mirai.rpg/.MainActivity || true
            sleep 40
            adb exec-out screencap -p > emulator-boot.png || true
            adb shell input tap 540 1400 || true
            sleep 3
            adb exec-out screencap -p > emulator-after-tap.png || true
            adb logcat -d -v time > emulator-logcat.txt || true
            echo "--- app pid ---"
            adb shell pidof com.mirai.rpg || true
            echo "--- fatal exceptions ---"
            grep -E "FATAL EXCEPTION|AndroidRuntime|horcrux" emulator-logcat.txt | head -40 || true
            echo "--- focused window ---"
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            emulator-logcat.txt
            emulator-boot.png
            emulator-after-tap.png
            gradle-x86.log
          if-no-files-found: warn
