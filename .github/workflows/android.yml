name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirai-rpg-preview-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.mirai.rpg
            adb shell am start -W -n com.mirai.rpg/.MainActivity > emulator-start.txt
            sleep 3
            adb exec-out screencap -p > emulator-screen-after-start.png
            sleep 12
            adb exec-out screencap -p > emulator-screen-after-15s.png
            adb logcat -d -v time > emulator-logcat.txt || true
            echo "--- app pid ---"
            adb shell pidof com.mirai.rpg || true
            echo "--- focused window ---"
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            emulator-logcat.txt
            emulator-start.txt
            emulator-screen-after-start.png
            emulator-screen-after-15s.png
          if-no-files-found: warn
