name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  # Fast gate, runs in parallel with the APK builds. Types and unit tests
  # cannot see a hook registered after a conditional return, so
  # rules-of-hooks is the rule that matters here: its only symptom is
  # "Rendered more hooks than during the previous render" on the first
  # frame after a cold start, on the user's device, in a release build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci --silent

      - name: Lint
        run: npx expo lint

  # The deliverable: a per-ABI arm64-v8a release APK for the target phone
  # (Xiaomi Mi 10, Snapdragon 865). Roughly half the size of a universal
  # build, which is a faster install and a faster cold start. The split is
  # injected by plugins/withAndroidBuildTuning.js, not by this file.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      # Step 1 is deliberately the conservative configuration: universal
      # ABI set, no R8, no resource shrinking. Everything it uses is stock
      # Expo, so it is the variant that must always produce an APK. R8 and
      # shrinking are on in app.json; -P overrides the value prebuild writes
      # into gradle.properties, so a tuning problem can never leave the
      # project without an installable APK.
      - name: Build baseline release APK
        shell: bash
        run: |
          # `bash -e` aborts on the first failing command, so the pipeline is
          # captured with `|| status=$?` - otherwise the diagnostics below
          # never run and the reason is invisible.
          status=0
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=false \
            -Pandroid.enableProguardInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle-baseline.log || status=$?
          if [ "$status" -ne 0 ]; then
            # One annotation, not one per line: the check-run API caps
            # annotations at 10, so a per-line loop silently loses the
            # reason. %0A keeps the newlines readable in the UI.
            echo "::error title=gradle::$(grep -v '^[[:space:]]*$' ../gradle-baseline.log | tail -n 25 | sed -e 's/%/%25/g' -e 's/\r//' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: mirai-rpg-apk-universal
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Step 2 applies the device tuning from mirai-rpg-mi10-optimization.md:
      # R8, resource shrinking and an arm64-v8a-only split. It is allowed to
      # fail so a regression in the tuning cannot block the release, and its
      # failure reason is echoed as annotations because a gradle failure is
      # otherwise invisible through the API without repo admin rights.
      - name: Build tuned arm64 APK
        continue-on-error: true
        shell: bash
        run: |
          status=0
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=true \
            -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../gradle-arm64.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=gradle arm64::$(grep -v '^[[:space:]]*$' ../gradle-arm64.log | tail -n 25 | sed -e 's/%/%25/g' -e 's/\r//' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"

      - name: Upload tuned arm64 APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mirai-rpg-apk-arm64
          path: android/app/build/outputs/apk/release/*arm64*.apk
          if-no-files-found: warn

      - name: Upload gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            gradle-baseline.log
            gradle-arm64.log
          if-no-files-found: warn

      - name: Report APK sizes
        if: always()
        run: |
          cd android/app/build/outputs/apk/release 2>/dev/null || exit 0
          for f in *.apk; do
            echo "$(du -h "$f" | cut -f1)  $f"
          done

  # x86_64 build for the emulator smoke test, in parallel so it does not
  # extend the wall clock. continue-on-error throughout: the emulator is a
  # smoke signal, not a gate, and it has never been a substitute for the
  # real device.
  # extend the wall clock.
  #
  # The emulator step itself keeps `continue-on-error`, because a flaky
  # emulator must not block a release. The job does not: the gate step at
  # the end fails the build when the app demonstrably rendered nothing,
  # which is the failure this job used to swallow whole.
  smoke-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build x86_64 release APK
        shell: bash
        run: |
          status=0
          cd android
          ./gradlew :app:assembleRelease --no-daemon \
            -Pmirai.arm64Only=false \
            -Pandroid.enableProguardInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -PreactNativeArchitectures=x86_64 2>&1 | tee ../gradle-x86.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=gradle x86::$(grep -v '^[[:space:]]*$' ../gradle-x86.log | tail -n 25 | sed -e 's/%/%25/g' -e 's/\r//' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"

      - name: Run Android emulator smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set +e
            APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            echo "installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.mirai.rpg
            adb shell am start -n com.mirai.rpg/.MainActivity || true
            sleep 35
            adb exec-out screencap -p > smoke-1-home.png || true

            # Reproduce the reported failure: complete a quest, then return
            # to Home. The quest card's "Готово" button fills the right half
            # of the first card; Home is the first tab.
            adb shell input tap 560 900 || true
            sleep 4
            adb exec-out screencap -p > smoke-2-quest-done.png || true
            adb shell input tap 135 2140 || true
            sleep 5
            adb exec-out screencap -p > smoke-3-back-home.png || true

            adb logcat -d -v time > emulator-logcat.txt || true

            # Reported as annotations, because job logs need repo admin
            # rights to download and this run has none. The app lifecycle
            # lines answer the only question that matters here: did Home
            # mount, and did its load finish.
            echo "--- app lifecycle ---"
            grep "MiraiRPG" emulator-logcat.txt | tail -30 | while IFS= read -r line; do
              echo "::warning title=home-lifecycle::${line}"
            done

            # Any JS or native error, one annotation per line.
            echo "--- errors ---"
            grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS.*rror|horcrux" emulator-logcat.txt \
              | head -12 | while IFS= read -r line; do
              echo "::error title=app-error::${line}"
            done

            echo "--- focused window ---"
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true

            # Evidence only. The verdict is the gate step below, kept separate so a
            # broken emulator cannot be mistaken for a broken app.
            if grep -q "Home: load done" emulator-logcat.txt; then
              echo "::notice title=smoke::Home rendered and loaded"
            else
              echo "::warning title=smoke::Home never finished loading - see the gate step"
            fi
            exit 0

      # The first real assertion this job ever had.
      #
      # The screenshots were uploaded and read by nobody, every command in
      # the step above is `|| true`, and the job ended in `exit 0` - so a
      # launch that showed nothing but the app background produced a green
      # build. That is how a blank screen shipped.
      #
      # The app logs its own lifecycle, and one line separates "the process
      # started" from "the interface exists": `Home: load done` means Home
      # committed a render and its queries resolved. Infrastructure failures
      # still pass - no logcat, or no app log at all, means the emulator or
      # the install is what broke - so this only fails on a real product
      # failure.
      - name: Enforce smoke gate
        run: |
          set -uo pipefail
          if [ ! -s emulator-logcat.txt ]; then
            echo "::warning title=smoke-gate::no logcat - the emulator step did not get far enough to judge. Not a product signal."
            exit 0
          fi
          if ! grep -q "MiraiRPG" emulator-logcat.txt; then
            echo "::error title=smoke-gate::the app never logged a line. Launch failed, or the emulator is broken. Not held against the build."
            exit 0
          fi
          if grep -q "UNCAUGHT" emulator-logcat.txt; then
            grep "UNCAUGHT" emulator-logcat.txt | head -5 | while IFS= read -r line; do
              echo "::error title=uncaught::${line}"
            done
          fi
          if ! grep -q "Home: load done" emulator-logcat.txt; then
            echo "::error title=smoke-gate::Home never finished loading. The app started but never rendered a usable screen."
            grep "MiraiRPG" emulator-logcat.txt | tail -20 | while IFS= read -r line; do
              echo "::error title=smoke-tail::${line}"
            done
            echo "::error title=smoke-gate::A UI-thread or async failure is the usual cause and no error boundary can catch it. Check the android-emulator-diagnostics artifact for ReactNativeJS and Reanimated lines."
            exit 1
          fi
          echo "::notice title=smoke-gate::passed - Home rendered and loaded"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            emulator-logcat.txt
            smoke-1-home.png
            smoke-2-quest-done.png
            smoke-3-back-home.png
            gradle-x86.log
          if-no-files-found: warn
